<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640" role="img" aria-labelledby="title desc">
  <title id="title">Decision Point Initiative seal</title>
  <desc id="desc">Deep green circular seal with an ivory compass rose, Decision Point Initiative name, established 2024, and the motto Ex complexitate, claritas.</desc>
  <defs>
    <path id="titleArc" d="M 112 330 A 208 208 0 0 1 528 330"/>
    <path id="mottoArc" d="M 145 425 A 200 200 0 0 0 495 425"/>
  </defs>
  <rect width="640" height="640" fill="#073a2a"/>
  <circle cx="320" cy="320" r="268" fill="#f4f0e6" stroke="#073a2a" stroke-width="6"/>
  <circle cx="320" cy="320" r="250" fill="#073a2a" stroke="#f4f0e6" stroke-width="3"/>
  <circle cx="320" cy="320" r="235" fill="none" stroke="#f4f0e6" stroke-width="2"/>
  <circle cx="320" cy="320" r="160" fill="none" stroke="#f4f0e6" stroke-width="4"/>
  <circle cx="320" cy="320" r="148" fill="none" stroke="#f4f0e6" stroke-width="1.5" opacity=".8"/>
  <g fill="#f4f0e6" font-family="Georgia, 'Times New Roman', serif" text-anchor="middle">
    <text font-size="47" letter-spacing="4"><textPath href="#titleArc" startOffset="50%">DECISION POINT</textPath></text>
    <text x="320" y="498" font-size="46" letter-spacing="8">INITIATIVE</text>
    <text x="438" y="100" font-size="19" letter-spacing="3">ESTD 2024</text>
    <text font-size="18" letter-spacing="3"><textPath href="#mottoArc" startOffset="50%">EX COMPLEXITATE, CLARITAS</textPath></text>
  </g>
  <g transform="translate(320 320)">
    <polygon points="0,-150 21,-34 0,0 -21,-34" fill="#f4f0e6"/>
    <polygon points="0,150 21,34 0,0 -21,34" fill="#2d7659"/>
    <polygon points="150,0 34,21 0,0 34,-21" fill="#f4f0e6"/>
    <polygon points="-150,0 -34,21 0,0 -34,-21" fill="#f4f0e6"/>
    <polygon points="103,-103 30,-18 0,0 18,-30" fill="#f4f0e6"/>
    <polygon points="103,103 18,30 0,0 30,18" fill="#2d7659"/>
    <polygon points="-103,103 -30,18 0,0 -18,30" fill="#f4f0e6"/>
    <polygon points="-103,-103 -18,-30 0,0 -30,-18" fill="#2d7659"/>
    <polygon points="0,-150 0,0 -21,-34" fill="#2d7659" opacity=".8"/>
    <polygon points="150,0 0,0 34,-21" fill="#2d7659" opacity=".7"/>
    <circle r="8" fill="#073a2a" stroke="#f4f0e6" stroke-width="2"/>
  </g>
</svg>
